name: Rodar Windows 11 Lite com Acesso

on:
  workflow_dispatch:

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockurr/windows

      - name: Instalar e Iniciar o Ngrok
        run: |
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.sh > /dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok -y
          
          # Cole seu token abaixo no lugar de SEU_TOKEN_AQUI
          ngrok config add-authtoken SEU_TOKEN_AQUI
          
          # Inicia o túnel HTTP na porta 8006
          ngrok http 8006 --log=stdout &
          
          echo "Gerando seu link de acesso visual..."
          sleep 10
          
          echo "=================================================="
          echo "👉 CLIQUE NO LINK ABAIXO PARA VER O WINDOWS LIGAR:"
          curl -s http://127.0.0 | jq -r '.tunnels[0].public_url'
          echo "=================================================="

      - name: Manter a VM ativa
        run: |
          echo "Servidor ativo! Deixe esta aba do GitHub aberta para manter a VM ligada."
          sleep 18000 
