name: Rodar Windows 11 Lite

on:
  workflow_dispatch: # Permite iniciar manualmente na aba Actions

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockur/windows

      - name: Manter a VM ativa
        run: |
          echo "Janela do Windows 11 iniciada com sucesso!"
          echo "Aguardando conexões..."
          # Mantém o workflow rodando por 5 horas
          sleep 18000 
