name: Rodar Windows 11 Lite com Acesso Direct

on:
  workflow_dispatch:

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockurr/windows

      - name: Conectar e Gerar Link na Tela
        run: |
          echo "Iniciando conexão reversa..."
          # Baixa o conector universal que não precisa descompactar
          curl -s https://pagekite.net -o pagekite.py
          chmod +x pagekite.py
          
          echo "=================================================="
          echo "👉 COPIE O LINK QUE APARECER LOGO ABAIXO:"
          # Usa o seu token para criar o endereço público direto nos logs do GitHub
          python3 pagekite.py 8006 WS49J2A0sHbhFcfV8pTwdPOMUrD1ynvuz.pagekite.me --is_headless &
          
          sleep 10
          echo "Seu link de acesso é: https://WS49J2A0sHbhFcfV8pTwdPOMUrD1ynvuz.pagekite.me"
          echo "=================================================="

      - name: Manter a VM ativa
        run: |
          echo "Servidor ativo! Mantenha esta aba aberta."
          sleep 18000 
