services:
  windows:
    image: dockur/windows
    container_name: windows11_vm
    environment:
      VERSION: "tiny11"
      RAM_SIZE: "2G"
      CPU_CORES: "2"
      DISK_SIZE: "20G"
    ports:
      - 8006:8006
      - 3389:3389
    volumes:
      - ./win_data:/storage
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

