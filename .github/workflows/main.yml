name: Rodar Windows 11 Lite - LocalToNet Fixo

on:
  workflow_dispatch:

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockurr/windows

      - name: Conectar e Manter o Túnel Ativo
        run: |
          # Baixa e instala o cliente oficial do LocalToNet
          curl -L https://github.com -o localtonet.zip
          unzip -o localtonet.zip
          chmod +x localtonet
          
          echo "=================================================="
          echo "Conectando ao painel do LocalToNet..."
          echo "Mantenha esta aba do GitHub aberta!"
          echo "=================================================="
          
          # Executa em primeiro plano (sem o & no final) para o GitHub não matar o processo
          ./localtonet -token WS49J2A0sHbhFcfV8pTwdPOMUrD1ynvuz -protocol http -port 8006
