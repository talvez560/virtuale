name: Rodar Windows 11 Lite - Sem Token

on:
  workflow_dispatch:

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockurr/windows

      - name: Gerar Link de Acesso Instantâneo
        run: |
          echo "Criando túnel de acesso seguro..."
          # Cria o link público usando apenas SSH nativo do Linux, sem exigir contas ou tokens
          ssh -o StrictHostKeyChecking=no -R 80:localhost:8006 nokey@localhost.run > tunnel.log 2>&1 &
          
          sleep 5
          echo "=================================================="
          echo "👉 SEU LINK DE ACESSO VISUAL AO WINDOWS RECENTE:"
          grep -oE 'https://[a-zA-Z0-9.-]+\.localhost\.run' tunnel.log || echo "Aguardando link... Execute a etapa novamente se falhar."
          echo "=================================================="

      - name: Manter a VM ativa
        run: |
          echo "Servidor ativo! Mantenha esta aba aberta."
          sleep 18000 
