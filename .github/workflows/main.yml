name: Rodar Windows 11 Lite com LocalToNet

on:
  workflow_dispatch:

jobs:
  rodar-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar e Iniciar a VM Windows 11
        run: |
          docker run -d \
            --name windows11_vm \
            --privileged \
            --cap-add=NET_ADMIN \
            -e VERSION="tiny11" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="20G" \
            -p 8006:8006 \
            -p 3389:3389 \
            dockurr/windows

      - name: Instalar e Iniciar o LocalToNet
        run: |
          # Baixa e extrai o cliente do LocalToNet no Linux do GitHub
          curl -L https://github.com -o localtonet.zip
          unzip localtonet.zip
          chmod +x localtonet
          
          # SUBISTITUA APENAS O TEXTO INDICADO ABAIXO PELO SEU TOKEN MANTENDO O -token ANTES
          ./localtonet -token WS49J2A0sHbhFcfV8pTwdPOMUrD1ynvuz -protocol http -port 8006 &
          
          echo "=================================================="
          echo "Conexão estabelecida com sucesso!"
          echo "👉 Acesse o site do LocalToNet para pegar o seu link."
          echo "=================================================="
          sleep 5

      - name: Manter a VM ativa
        run: |
          echo "Servidor ativo! Deixe esta aba do GitHub aberta para manter a VM ligada."
          sleep 18000 
